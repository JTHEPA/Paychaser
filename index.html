.log{font-size:13.5px;border-top:1px solid var(--line);padding:7px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
textarea{min-height:120px;resize:vertical}

<body>
<canvas id="rain" aria-hidden="true"></canvas><main>
 <div class="top"><b>PayChaser</b>
  <span id="who" class="mute" style="margin-left:auto;margin-right:10px;font-size:12.5px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn ghost" id="lo" style="padding:6px 10px;margin-right:8px">Log out</button><select id="cur" aria-label="Currency"><option>$</option><option>£</option><option>€</option><option>R</option></select></div>
 <div id="view"></div>
</main>
<nav id="nav">
 <button data-t="today">Today</button><button data-t="inv">Invoices</button><button data-t="cli">Clients</button>
</nav>
<script>
var S={tab:"today",cur:"$",chase:null,add:false,log:[],inv:[],exp:12000};
function iso(o){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
function dd(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5)}
var T=iso(0);
function seed(){S.inv=[
 {id:1,c:"Northwind Studio",d:"Brand identity",a:2400,due:iso(-18),paid:null,n:0,r:{k:"inst",d:""}},
 {id:2,c:"Kora Labs",d:"Monthly retainer",a:3500,due:iso(-9),paid:null,n:1,p:iso(-2)},
 {id:3,c:"Bright Agency",d:"Landing page build",a:1800,due:iso(-3),paid:null,n:0,b:"po",tx:iso(-1)},
 {id:4,c:"Amara Foods",d:"Packaging design",a:950,due:iso(5),paid:null,n:0},
 {id:5,c:"Kora Labs",d:"Workshop",a:1500,due:iso(12),paid:null,n:0},
 {id:6,c:"Kora Labs",d:"Retainer (last)",a:3500,due:iso(-40),paid:iso(-28),n:2},
 {id:7,c:"Northwind Studio",d:"Logo",a:1200,due:iso(-60),paid:iso(-41),n:3},
 {id:8,c:"Bright Agency",d:"Audit",a:800,due:iso(-50),paid:iso(-49),n:0}]}
function K(){return"pc5:"+(S.user||"")}
function loadData(){S.inv=[];S.log=[];S.exp=12000;try{var sv=localStorage.getItem(K());if(sv){var p=JSON.parse(sv);if(Array.isArray(p.inv)&&Array.isArray(p.log)){S.inv=p.inv;S.log=p.log}}else seed()}catch(e){seed()}}

function save(){try{localStorage.setItem(K(),JSON.stringify({inv:S.inv,log:S.log}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function m(n){return S.cur+Math.round(n).toLocaleString("en-US")}
function late(i){return i.paid?0:dd(T,i.due)}
function tone(l){return l<=0?"Friendly":l<7?"Gentle nudge":l<14?"Firm":"Final notice"}
function avgLate(c){var xs=S.inv.filter(function(i){return i.c===c}).map(function(i){return i.paid?Math.max(0,dd(i.paid,i.due)):Math.max(0,late(i))});
 return xs.length?xs.reduce(function(a,b){return a+b},0)/xs.length:0}
function score(c){return Math.max(5,Math.round(100-avgLate(c)*3.5))}
function label(s){return s>=75?["Reliable","ok"]:s>=45?["Slow","warn"]:["Risky","late"]}
function unpaid(){return S.inv.filter(function(i){return!i.paid})}
function draft(i){var l=late(i),t=tone(l),a=m(i.a),h="Hi "+i.c.split(" ")[0]+",\n\n";
 if(t==="Friendly")return h+"Quick heads-up that invoice #"+i.id+" ("+i.d+", "+a+") is due "+(l===0?"today":"in "+(-l)+" days")+". Here’s the pay-now link whenever suits: pay.paychaser.app/"+i.id+"\n\nThanks!";
 if(t==="Gentle nudge")return h+"Invoice #"+i.id+" ("+i.d+", "+a+") passed its due date "+l+" days ago. It may have slipped through. You can pay in one tap here: pay.paychaser.app/"+i.id+"\n\nIf something’s holding it up, tell me and we’ll sort it out.";
 if(t==="Firm")return h+"Invoice #"+i.id+" ("+a+") is now "+l+" days overdue. Please pay today, or reply with the date you will. If it helps, I can split it into two instalments: pay.paychaser.app/"+i.id;
 return h+"Invoice #"+i.id+" ("+a+") is now "+l+" days overdue and I would like to get this settled. Please pay by "+iso(3)+" or reply with a date that works. If anything is blocking payment, tell me and we will fix it. Pay now: pay.paychaser.app/"+i.id}
function expDay(i){return Math.max(1,dd(i.due,T)+Math.round(avgLate(i.c)))}
var BL={dispute:{t:"Disputed amount",act:"They dispute the amount. Review the invoice and agree a corrected figure before chasing again."},po:{t:"Needs a purchase order",act:"They need a purchase order. Send the PO details and ask for the PO number."},miss:{t:"Never received it",act:"They say they never got it. Resend the invoice to the right contact."},det:{t:"Details need correcting",act:"Invoice details are wrong. Issue a corrected invoice, then restart reminders."}};
function has(t,a){return a.some(function(w){return t.indexOf(w)>-1})}
function classify(t){t=" "+t.toLowerCase().replace(/[^a-z ]/g," ")+" ";
 if(has(t,["dispute","too much","wrong amount","incorrect amount","overcharg"]))return"dispute";
 if(has(t,["purchase order"," po ","po number"]))return"po";
 if(has(t,["never received","not receive","didn t receive","did not receive","didn t get","not received"]))return"miss";
 if(has(t,["wrong name","wrong address","wrong email","wrong details","incorrect details","tax number","vat number","correct details"]))return"det";
 return""}
function nextAction(i){var l=late(i);if(i.r)return RQ[i.r.k].act;
 if(i.b)return BL[i.b].act;
 if(broken(i))return"Missed their promise. Call or send a firm follow-up and ask for a part-payment.";
 if(i.n>=3)return"Ignored "+i.n+" reminders. Time to call them yourself.";
 if(l>=14)return"Send the final notice and offer two instalments.";
 if(l>=7)return"Send a firm reminder with a pay-now link.";
 if(l>0)return"Send a friendly reminder with a pay-now link.";
 return"Not due yet."}
function onTime(c){var x=S.inv.filter(function(i){return i.c===c&&(i.paid||late(i)>0)});if(!x.length)return 100;return Math.round(x.filter(function(i){return i.paid&&dd(i.paid,i.due)<=0}).length/x.length*100)}
function kept(c){var b=S.inv.filter(function(i){return i.c===c&&broken(i)}).length;return b?b+" missed promise"+(b>1?"s":""):"no missed promises"}
function planHTML(){
 var all=unpaid().filter(function(i){return late(i)>0}),u=all.slice().sort(function(a,b){return priority(b)-priority(a)}).slice(0,4);
 var tot=all.reduce(function(s,i){return s+i.a},0),stuck=all.filter(function(i){return i.b}).reduce(function(s,i){return s+i.a},0);
 var h='<div class="card" style="border-color:var(--acc)"><div class="mute">Get me paid</div><div class="big ok" style="font-size:34px">'+m(tot)+'</div><p class="mute" style="margin:2px 0 8px">Overdue and potentially collectible this week. An estimate, not guaranteed cash.'+(stuck?' '+m(stuck)+' is stuck on a client issue.':'')+'</p><b>Collection plan for today</b>';
 h+=u.length?u.map(function(i,k){var hi=k===0||late(i)>=14;return'<div class="log"><div class="row"><span><b>'+(k+1)+'. '+esc(i.c)+' - '+m(i.a)+'</b> <span class="pill '+(hi?"late":"warn")+'">'+(hi?"High priority":"Follow up")+'</span><div class="mute">'+late(i)+' days late. '+nextAction(i)+'</div></span><button class="btn ghost" data-chase="'+i.id+'">Act</button></div></div>'}).join(""):'<p class="empty">Nothing overdue. Nice.</p>';
 return h+'</div>'}
function cashIn(hz,mode){return unpaid().reduce(function(s,i){var e=mode==="best"?Math.max(1,dd(i.due,T)):Math.max(1,dd(i.due,T)+Math.round(avgLate(i.c))+(mode==="slow"?10:0));return e<=hz?s+i.a:s},0)}
function scen(){var hz=S.hz||30,rows=[["Best case","best","everyone pays on the due date"],["Expected","exp","clients pay as they usually do"],["Delayed","slow","10 days later than usual"]];
 var h='<div class="card"><h3>Cash scenarios</h3><label for="hz">Look ahead</label><select id="hz">'+[7,14,30,60].map(function(d){return'<option value="'+d+'"'+(d===hz?" selected":"")+'>'+d+' days</option>'}).join("")+'</select>';
 rows.forEach(function(r){var v=cashIn(hz,r[1]),g=S.exp*hz/30-v;h+='<div class="log"><div class="row"><span><b>'+r[0]+'</b><div class="mute">'+r[2]+'</div></span><span style="text-align:right"><b>'+m(v)+'</b><div class="'+(g>0?"late":"ok")+'" style="font-size:12.5px">'+(g>0?"short "+m(g):"covered")+'</div></span></div></div>'});
 return h+'</div>'}
var RQ={time:{t:"asked for more time",act:"Client asked for more time. Approve the new date or decline."},inst:{t:"asked to pay in instalments",act:"Client asked to pay in instalments. Approve or decline the plan."},recv:{t:"says they never got the invoice",act:"Client says they never got it. Resend it to the right contact."},appr:{t:"is waiting for internal approval",act:"Client is waiting on internal approval. Agree a date and check back."},q:{t:"has a question",act:"Client has a question. Reply to them before chasing."}};
function rqTxt(r){return RQ[r.k].t+(r.d?" ("+r.d+")":"")}
function preview(){var a=unpaid().filter(function(i){return late(i)>0&&!(i.p&&dd(i.p,T)>=0)&&!i.b&&!i.r});return"Will send: "+a.map(function(i){return tone(late(i)).toLowerCase()+" to "+i.c}).join("; ")+". Nothing sends until you press the button."}
function dueSoon(){var a=unpaid().filter(function(i){return late(i)<=0&&late(i)>=-5});
 if(!a.length)return"";return'<div class="card"><h3>Before payment is due</h3>'+a.map(function(i){return'<div class="log"><b>'+esc(i.c)+'</b> '+m(i.a)+' due in '+(-late(i))+' days<div class="mute">Send a friendly check: did they get it, and do they need a purchase order?</div></div>'}).join("")+'</div>'}
function health(){var all=S.inv.filter(function(i){return i.paid||late(i)>0}),n=all.length||1;
 var ontime=all.filter(function(i){return i.paid&&dd(i.paid,i.due)<=0}).length,pct=Math.round(ontime/n*100);
 var avg=all.reduce(function(s,i){return s+Math.max(0,i.paid?dd(i.paid,i.due):late(i))},0)/n;
 var od=unpaid().filter(function(i){return late(i)>0}).length,sc=Math.max(0,Math.min(100,Math.round(100-avg*3-od/Math.max(1,S.inv.length)*40)));
 var tip=S.inv.some(function(i){return!i.paid&&(i.b||i.r)})?"Resolve client issues first: they block payment.":avg>7?"Ask slow payers for a deposit before starting work.":"Confirm clients received each invoice before it is due.";
 var col=sc>=75?"ok":sc>=50?"warn":"late";
 return'<div class="card"><h3>Payment health</h3><div class="row" style="align-items:center"><div class="big '+col+'" style="font-size:40px">'+sc+'<span class="mute" style="font-size:14px"> /100</span></div><span class="mute" style="text-align:right">'+pct+'% paid on time<br>avg delay '+Math.round(avg)+' days<br>'+od+' overdue now</span></div><p style="margin:8px 0 0"><b>Next improvement:</b> '+tip+'</p><p class="mute" style="margin:6px 0 0">Formula: 100 minus 3 per average day late, minus up to 40 for the share of invoices overdue. Based on '+all.length+' invoices.</p></div>'}
function coach(){var h='<div class="card"><h3>Cash coach</h3><p class="mute" style="margin:4px 0 8px">Ask about your business. Answers use your invoices and costs, and are estimates.</p><div class="acts"><button class="btn ghost" data-q="a">Can I cover my costs?</button><button class="btn ghost" data-q="b">Who should I chase today?</button><button class="btn ghost" data-q="c">Biggest client 2 weeks late?</button></div>';
 if(S.ans)h+='<p style="margin:10px 0 0">'+esc(S.ans)+'</p>';return h+'</div>'}
function answer(k){var u=unpaid(),v;
 if(k==="a"){v=cashIn(30,"exp");return v>=S.exp?"Yes, on expected timing: "+m(v)+" should arrive in 30 days against "+m(S.exp)+" of costs.":"Not yet. You expect "+m(v)+" in 30 days against "+m(S.exp)+" of costs, a gap of "+m(S.exp-v)+"."}
 if(k==="b"){var t=u.filter(function(i){return late(i)>0}).sort(function(a,b){return priority(b)-priority(a)})[0];return t?t.c+" ("+m(t.a)+"). "+nextAction(t):"Nothing is overdue today."}
 var by={};u.forEach(function(i){by[i.c]=(by[i.c]||0)+i.a});var big=Object.keys(by).sort(function(a,b){return by[b]-by[a]})[0];if(!big)return"No unpaid invoices.";
 v=u.reduce(function(s,i){var e=expDay(i)+(i.c===big?14:0);return e<=30?s+i.a:s},0);return"If "+big+" ("+m(by[big])+" owed) pays two weeks late, you expect "+m(v)+" in 30 days, "+(v>=S.exp?"still covering your costs.":"short by "+m(S.exp-v)+" against your costs.")}
var BIZ="Your Studio";
function tok(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
function tk(i){if(!i.tk)i.tk=tok();if(!i.tx)i.tx=iso(30);return i.tk}

(function(){var c=document.getElementById("rain");if(!c||!c.getContext)return;var x=c.getContext("2d"),W=0,H=0,D=[],dpr=Math.min(2,window.devicePixelRatio||1),rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function drop(r){return{x:Math.random()*(W+200)-100,y:r?Math.random()*H:-20,l:10+Math.random()*22,v:9+Math.random()*10,a:.12+Math.random()*.3,o:Math.random()<.08}}
function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);var n=Math.min(300,Math.round(W*H/6500));D=[];for(var i=0;i<n;i++)D.push(drop(true))}
function draw(){x.clearRect(0,0,W,H);for(var i=0;i<D.length;i++){var d=D[i];x.strokeStyle=d.o?"rgba(255,140,60,"+d.a+")":"rgba(190,205,225,"+d.a+")";x.lineWidth=d.o?1.2:1;x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x-d.l*.18,d.y+d.l);x.stroke();if(!rm){d.y+=d.v;d.x-=d.v*.18;if(d.y>H)D[i]=drop(false)}}
if(!rm)requestAnimationFrame(draw)}
size();draw();addEventListener("resize",function(){size();if(rm)draw()})})();
